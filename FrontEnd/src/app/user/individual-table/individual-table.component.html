<div class="numbers-card">
  <div class="numbers-header">
    <h3 class="numbers-title">
      <i class="fas fa-th"></i>
      Tus números
    </h3>
  </div>
  <div class="numbers-body">
    <div class="numbers-grid">
      <div *ngFor="let num of numbers" class="cell" [ngClass]="getHighlightClass(num.number)"
        pTooltip="{{getTooltipMessage(num.dates)}}" tooltipPosition="top" placeholder="Top">
        <div class="text">{{ num.number }}</div>
        <div *ngIf="num.count > 1" class="tiny-text">
          {{ num.count }}
        </div>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="color-box highlight-green"></div> Solo ha salido una vez
      </div>
      <div class="legend-item">
        <div class="color-box highlight-blue"></div> Ha salido multiples veces
      </div>
    </div>
  </div>
</div>
