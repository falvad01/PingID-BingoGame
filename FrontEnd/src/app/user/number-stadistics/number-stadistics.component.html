<div class="rankings-container">
  <!-- Line Rankings -->
  <div class="ranking-section">
    <div class="section-title">
      <i class="fas fa-minus"></i>
      Top Línea
    </div>

    <div class="ranking-grid">
      <!-- First Place -->
      <div class="rank-card gold">
        <div class="rank-medal">
          <i class="fas fa-trophy"></i>
          <span class="rank-num">1</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{firstLineName}}</div>
          <div class="player-score">{{firstLineSubtext}}</div>
        </div>
      </div>

      <!-- Second Place -->
      <div class="rank-card silver">
        <div class="rank-medal">
          <i class="fas fa-medal"></i>
          <span class="rank-num">2</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{secondLineName}}</div>
          <div class="player-score">{{secondLineSubtext}}</div>
        </div>
      </div>

      <!-- Third Place -->
      <div class="rank-card bronze">
        <div class="rank-medal">
          <i class="fas fa-medal"></i>
          <span class="rank-num">3</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{thirdLineName}}</div>
          <div class="player-score">{{thirdLineSubtext}}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bingo Rankings -->
  <div class="ranking-section">
    <div class="section-title">
      <i class="fas fa-th"></i>
      Top Bingo
    </div>

    <div class="ranking-grid">
      <!-- First Place -->
      <div class="rank-card gold">
        <div class="rank-medal">
          <i class="fas fa-trophy"></i>
          <span class="rank-num">1</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{firstBingoName}}</div>
          <div class="player-score">{{firstBingoSubtext}}</div>
        </div>
      </div>

      <!-- Second Place -->
      <div class="rank-card silver">
        <div class="rank-medal">
          <i class="fas fa-medal"></i>
          <span class="rank-num">2</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{secondBingoName}}</div>
          <div class="player-score">{{secondBingoSubtext}}</div>
        </div>
      </div>

      <!-- Third Place -->
      <div class="rank-card bronze">
        <div class="rank-medal">
          <i class="fas fa-medal"></i>
          <span class="rank-num">3</span>
        </div>
        <div class="rank-content">
          <div class="player-name">{{thirdBingoName}}</div>
          <div class="player-score">{{thirdBingoSubtext}}</div>
        </div>
      </div>
    </div>
  </div>
</div>
