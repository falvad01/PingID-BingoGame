<div class="timeline-card">
  <div class="timeline-header">
    <h3 class="timeline-title">
      <i class="fas fa-history"></i>
      Historial de Hoy
    </h3>
  </div>
  <div class="timeline-body">
    <div *ngFor="let td of todayNumbers" class="timeline-item">
      <div class="timeline-user">
        <img [src]="td.User.profile_image || '../../../assets/user.png'" alt="{{td.User.username}}" class="user-avatar">
        <div class="user-info">
          <span class="username">{{td.User.username}}</span>
          <span class="time-text">{{td.text}}</span>
        </div>
      </div>
      <div class="number-badge" [class.repeated]="td.alreadyExists">
        {{td.number}}
      </div>
    </div>
    <div *ngIf="!todayNumbers || todayNumbers.length === 0" class="no-data">
      <i class="fas fa-clock"></i>
      <p>No hay números registrados hoy</p>
    </div>
  </div>
</div>
