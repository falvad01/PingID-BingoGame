<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    /* Login Form */
    .login-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .login-section h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: #e0e0e0;
      color: #333;
    }

    button.secondary:hover {
      background: #d0d0d0;
    }

    /* Logged In Section */
    .logged-in-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .user-info {
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }

    .user-info p {
      margin: 5px 0;
      font-size: 13px;
      color: #555;
    }

    .user-info strong {
      color: #333;
    }

    .status-box {
      margin: 15px 0;
      padding: 12px;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1.4;
    }

    .status-box.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .status-box.info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }

    .status-box.warning {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
    }

    .status-box.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    #message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    #message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    #message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h2>🏓 PingID Bingo</h2>
      <p>Extensión de Auto-envío</p>
    </div>

    <!-- Loading State -->
    <div id="loadingSection" class="loading">
      <p>Cargando...</p>
    </div>

    <!-- Login Form -->
    <div id="loginSection" class="login-section hidden">
      <h3>Iniciar Sesión</h3>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
      </div>
      <button id="loginBtn">Iniciar Sesión</button>
      <div id="message"></div>
    </div>

    <!-- Logged In View -->
    <div id="loggedInSection" class="logged-in-section hidden">
      <div class="user-info">
        <p><strong>Usuario:</strong> <span id="displayUsername">-</span></p>
        <p><strong>Estado:</strong> <span style="color: #4CAF50;">● Conectado</span></p>
      </div>

      <div id="lastActionBox" class="status-box info">
        <strong>Última acción:</strong><br>
        <span id="lastActionText">Sin acciones recientes</span>
      </div>

      <button id="logoutBtn" class="secondary">Cerrar Sesión</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
